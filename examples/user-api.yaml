openapi: 3.0.3
info:
  title: User API
  version: 1.0.0
paths:
  /users/{id}:
    get:
      operationId: getUserById
      summary: Get a single user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: includePosts
          in: query
          required: true
          schema:
            type: boolean
      responses:
        "200":
          description: User found
        "400":
          description: Invalid request
  /users:
    post:
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                email:
                  type: string
                role:
                  type: string
                  enum:
                    - admin
                    - viewer
      responses:
        "201":
          description: User created
        "400":
          description: Validation error
